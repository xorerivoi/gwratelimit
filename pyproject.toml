[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xorerivoi-gwratelimit"
version = "0.1.0"
description = "用一组明示的正则规则扫描输入，报告API 网关的限流策略相关的命中行与片段"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "xorerivoi" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://xorerivoi.github.io"
Repository = "https://github.com/xorerivoi/gwratelimit"
Issues = "https://github.com/xorerivoi/gwratelimit/issues"

[project.scripts]
gwratelimit = "gwratelimit:main"

[tool.setuptools]
py-modules = ["gwratelimit"]
